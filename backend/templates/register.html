{% extends "base.html" %}

{% block title %}
    Create Account | MoMoGuard Ghana
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Create Your Account</h1>

            <p>
                Join MoMoGuard Ghana and help make mobile money
                transactions safer.
            </p>
        </div>

        <form method="POST" class="auth-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

            </div>

            <button
                type="submit"
                class="btn-primary auth-button"
            >
                Create Account
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Log in
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
